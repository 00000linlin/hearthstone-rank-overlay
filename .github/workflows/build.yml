name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: pwsh
        run: |
          ./tools/Get-Nsis.ps1
          ./build.ps1 -Test -Installer
      - uses: actions/upload-artifact@v4
        with:
          name: HearthstoneRank-windows
          path: |
            dist/*-Setup.exe
            dist/*-portable.zip
            dist/SHA256SUMS.txt
